<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사주로또 메인 화면 레이아웃 콘셉트 시안 비교 (1 & 2)</title>
  <style>
    body {
      background: #090d16;
      color: #fff;
      font-family: 'Pretendard', sans-serif;
      margin: 0;
      padding: 30px 20px;
      text-align: center;
    }
    h1 {
      color: #fbbf24;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }
    .preview-grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card-wrap {
      background: #131b2e;
      border: 1.5px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      padding: 20px;
      width: 380px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fbbf24;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 14px;
      line-height: 1.4;
      min-height: 40px;
    }
    img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <h1>📱 사주로또 신규 메인 화면 레이아웃 시안 비교</h1>
  <p class="sub">자잘한 네모 박스들을 싹 걷어내고, 여백과 품격을 살린 2가지 모바일 UI 콘셉트입니다.</p>

  <div class="preview-grid">
    <!-- 콘셉트 1 -->
    <div class="card-wrap">
      <div class="card-title">콘셉트 1: 원-카드(One-Card) 미니멀리즘</div>
      <div class="card-desc">당첨번호를 1줄 텍스트로 최소화하고, 화면 중앙에 단 하나의 플로팅 명품 카드만 띄운 토스/애플 스타일</div>
      <img src="concept1.jpg" alt="콘셉트 1: 원-카드 미니멀리즘">
    </div>

    <!-- 콘셉트 2 -->
    <div class="card-wrap">
      <div class="card-title">콘셉트 2: 2-Deck 황금 분할 대시보드</div>
      <div class="card-desc">상단 40%는 [오늘의 우주 기운 & 당첨볼 상황판], 하단 60%는 [내 맞춤 콘솔]로 시원하게 분할한 핀테크 스타일</div>
      <img src="concept2.jpg" alt="콘셉트 2: 2-Deck 황금 분할 대시보드">
    </div>
  </div>

</body>
</html>
