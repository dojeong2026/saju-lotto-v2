<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사주로또 v2 - 모바일 1화면 핏</title>
  <link rel="stylesheet" href="v2_style.css">
</head>
<body>

  <!-- 최상단 바 -->
  <header class="top-bar">
    <div class="brand-title">🔮 사주로또 v2 연구소</div>
    <a href="index_v1.html" class="v1-btn">v1 클래식</a>
  </header>

  <div class="container">
    
    <!-- 1. 대형 최신 1243회 당첨 대시보드 (슬림 핏) -->
    <section class="latest-lotto-dashboard">
      <div class="round-header">
        <h2 class="round-title">1243회 당첨결과</h2>
        <span class="round-date">09.26 추첨</span>
      </div>

      <div class="big-ball-row">
        <div class="big-ball col-1">9</div>
        <div class="big-ball col-11">18</div>
        <div class="big-ball col-21">24</div>
        <div class="big-ball col-31">38</div>
        <div class="big-ball col-41">43</div>
        <div class="big-ball col-41">44</div>
        <span class="ball-plus">+</span>
        <div class="big-ball col-31">35</div>
      </div>

      <div class="prize-bar">
        <span>1등 (12명) <strong>25.9억</strong></span>
        <span>다음 회차 예상 <strong>약 50.5억</strong></span>
      </div>
    </section>

    <!-- 2. 2대 줄기 탭 스위처 -->
    <nav class="track-tabs">
      <button id="tab-lotto" class="tab-btn active" type="button">
        <span>🎰 사주 로또 추출</span>
      </button>
      <button id="tab-destiny" class="tab-btn" type="button">
        <span>📜 사주 & 운명수</span>
      </button>
    </nav>

    <!-- 3. 사주 정보 1줄 요약 바 (분석 완료 시 자동 노출 & 폼 접기) -->
    <div id="saju-summary-bar" class="saju-summary-bar" style="display: none;">
      <span class="info" id="summary-text">사주 분석 완료</span>
      <button id="btn-toggle-saju" class="btn-toggle" type="button">사주 변경 ✏️</button>
    </div>

    <!-- 4. 사주 입력 폼 (모바일 핏) -->
    <section class="card-slim" id="saju-form-card">
      <form id="saju-form">
        <div class="form-grid-slim">
          <div class="form-group-slim">
            <label for="birth-date">생년월일 (양력)</label>
            <input type="date" id="birth-date" value="1988-08-18" required>
          </div>
          <div class="form-group-slim">
            <label for="birth-hour">출생 시간</label>
            <select id="birth-hour">
              <option value="12" selected>오시 (11:30~13:29)</option>
              <option value="0">자시 (23:30~01:29)</option>
              <option value="2">축시 (01:30~03:29)</option>
              <option value="4">인시 (03:30~05:29)</option>
              <option value="6">묘시 (05:30~07:29)</option>
              <option value="8">진시 (07:30~09:29)</option>
              <option value="10">사시 (09:30~11:29)</option>
              <option value="14">미시 (13:30~15:29)</option>
              <option value="16">신시 (15:30~17:29)</option>
              <option value="18">유시 (17:30~19:29)</option>
              <option value="20">술시 (19:30~21:29)</option>
              <option value="22">해시 (21:30~23:29)</option>
              <option value="-1">모름</option>
            </select>
          </div>
          <div class="form-group-slim">
            <label for="birth-city">출생 지역 (시차보정)</label>
            <select id="birth-city">
              <option value="seoul" selected>서울·경기 (-32분)</option>
              <option value="busan">부산·경남 (-24분)</option>
              <option value="daegu">대구·경북 (-26분)</option>
              <option value="incheon">인천 (-33분)</option>
              <option value="gwangju">광주·전남 (-33분)</option>
              <option value="daejeon">대전·충청 (-31분)</option>
            </select>
          </div>
          <div class="form-group-slim">
            <label for="gender">성별</label>
            <select id="gender">
              <option value="male">남성</option>
              <option value="female">여성</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-slim-primary">
          <span>🔮 사주 맞춤 번호 5게임 추출하기</span>
        </button>
      </form>
    </section>

    <!-- ================= [제1줄기: 로또 번호 5게임 추출 뷰] ================= -->
    <main id="view-lotto">
      <section id="lotto-result-section">
        
        <!-- [핵심] 한 화면 쏙 들어오는 컴팩트 티켓 -->
        <div class="compact-ticket">
          <div class="ticket-top-summary">
            <h3>사주 조화 맞춤 행운 티켓</h3>
            <span class="stamp-badge">1244회 대비</span>
          </div>

          <!-- A자선 대신 의미 있는 제목이 달린 5개 게임 -->
          <div id="ticket-games">
            <!-- JS로 동적 렌더링 -->
          </div>

          <div class="ticket-bottom-bar">
            <span>추천 방위: <strong id="ticket-direction">-</strong></span>
            <span>최적 시간: <strong id="ticket-time">-</strong></span>
          </div>
        </div>

        <!-- 번호 보관 버튼 -->
        <button id="btn-save-numbers" class="btn-save-compact" type="button">
          💾 이번 5게임 내 폰에 보관하기 (저장됨: <span id="saved-count-badge">0</span>개)
        </button>
      </section>
    </main>

    <!-- ================= [제2줄기: 사주 & 운명수 뷰] ================= -->
    <main id="view-destiny" style="display: none;">
      <section id="destiny-content">
        <div class="card-slim" style="text-align: center; padding: 24px 14px;">
          <p style="color: var(--text-muted); font-size: 0.9rem;">
            사주를 입력하시면 선천수·후천수 및 전화번호 추천이 열립니다.
          </p>
        </div>
      </section>
    </main>

    <!-- 면책 문구 -->
    <footer class="disclaimer-compact">
      본 서비스는 정통 명리학의 상생 원리와 통계 데이터를 바탕으로 한 '상징적 행운 큐레이션'이며 당첨을 확정·보장하지 않습니다.
    </footer>

  </div>

  <script src="v2_app.js"></script>
</body>
</html>
